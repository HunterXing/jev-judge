name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A runner that stalls must cost ten minutes, not the default six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The package has no runtime dependencies and no build step on purpose:
      # `dsh plugin add` can load it straight from a checkout.
      #
      # `--test-timeout` turns a test that never settles into a named failure
      # instead of a step that runs until the job's own limit. The suite takes
      # about five seconds on a laptop and spawns real child processes, so two
      # minutes per test is generous; a hang means something is wrong with the
      # test, not with the machine's speed.
      #
      # `--test-reporter=spec` prints one line per test as it completes. The
      # default reporter buffers a test file's output until the file ends, which
      # is exactly what a hung file never does — the first CI run reported a
      # timeout with no way to see which test was running.
      - run: node --test --test-timeout=120000 --test-reporter=spec

name: Release

# Publishing is a deliberate act: pushing a version tag is the whole trigger, and
# nothing else in the repository can publish.
#
# Two ways in, one step. With no secret, npm's trusted publishing exchanges
# GitHub's OIDC identity for a short-lived credential and attaches a provenance
# attestation by itself. With NPM_TOKEN set, that granular token is used instead
# — which is what the *first* release needs, because a trusted publisher is
# configured on the package's own settings page and a package that has never been
# published has none (see docs/market.md).
on:
  push:
    tags: ['v*']
  # Lets a failed run be re-run from the Actions tab without moving the tag. A
  # fresh manual dispatch runs against a branch, and the tag check below refuses
  # it — publishing stays a deliberate act.
  workflow_dispatch:

permissions:
  # The OIDC token npm exchanges for a short-lived publish credential.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: '22'
          # `registry-url` is deliberately absent: it writes
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and an empty variable in
          # that line is exactly what the OIDC path does not need. npm already
          # defaults to its own registry, and the token path below passes its
          # credential as a flag rather than through a file.

      - name: Use the newest npm, which is what speaks OIDC
        run: npm install --global npm@latest

      - name: Fail early when the tag and the manifest disagree
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "releasing $version"

      # The same suite the CI workflow runs, so a tag cannot ship something the
      # push was allowed to break.
      - run: node --test

      # npm requires either 2FA or a granular token with 2FA bypass enabled for
      # every publish, and a logged-in CLI session satisfies neither. The flag
      # form keeps whichever credential is in use out of .npmrc and out of the
      # log.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "publishing with the repository's granular token"
            npm publish --//registry.npmjs.org/:_authToken="$NPM_TOKEN"
          else
            echo "publishing with trusted publishing (OIDC)"
            npm publish
          fi
